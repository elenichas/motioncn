name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      REGISTRY_URL: ${{ vars.REGISTRY_URL || 'https://motioncn.example.com' }}
      VITE_REGISTRY_URL: ${{ vars.REGISTRY_URL || 'https://motioncn.example.com' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # typecheck + generate the shadcn registry + build the site
      - run: npm run build
      # every registry item installs on its own and typechecks
      - run: npm run registry:verify
      # visual regression: 38 components x 3 states x 2 modes
      - run: npx playwright install --with-deps chromium
      - run: npm run test:visual
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
