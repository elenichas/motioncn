name: Update visual baselines

# Regenerates the Playwright screenshots on the same runner CI compares against, and commits them.
# Baselines made anywhere else (another OS, other fonts) never match what CI renders.
#
# Run it from the Actions tab (once this file is on the default branch), or push a commit whose
# message contains "[update snapshots]" to any branch.
on:
  workflow_dispatch:
  push:

permissions:
  contents: write

jobs:
  update:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[update snapshots]')
    runs-on: ubuntu-latest
    env:
      REGISTRY_URL: ${{ vars.REGISTRY_URL || 'https://motioncn.example.com' }}
      VITE_REGISTRY_URL: ${{ vars.REGISTRY_URL || 'https://motioncn.example.com' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --update-snapshots
      # The new baselines must hold on a second run, or the suite is flaky rather than out of date.
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
      - name: Commit the baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests
          if git diff --cached --quiet; then
            echo "Baselines already match."
          else
            git commit -m "Regenerate visual baselines on the CI runner"
            git push
          fi
